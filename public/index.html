<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VerseMate</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#1a1612;color:#e8dcc8;height:100vh;display:flex;flex-direction:column}
a{color:#c8973a}
h1,h2,h3{font-family:'Lora',serif;color:#c8973a}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#1a1612}
::-webkit-scrollbar-thumb{background:#3d2f1e;border-radius:3px}

/* ── Layout ── */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:260px;min-width:260px;background:#12100e;border-right:1px solid #3d2f1e;display:flex;flex-direction:column;overflow-y:auto;padding:1rem}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── Sidebar ── */
.sidebar-logo{text-align:center;padding:.75rem 0 .5rem}
.sidebar-logo .icon{font-size:2rem}
.sidebar-logo .name{font-family:'Lora',serif;font-size:1.2rem;color:#c8973a;font-weight:600}
.sidebar-logo .sub{font-size:.75rem;color:#a89070;margin-top:.2rem}
.sidebar-section{font-size:.75rem;color:#a89070;letter-spacing:.08em;text-transform:uppercase;margin:1rem 0 .4rem}
.mode-btn{width:100%;background:#2a1f14;color:#e8dcc8;border:1px solid #3d2f1e;border-radius:10px;padding:.55rem .8rem;font-family:'Inter',sans-serif;font-size:.85rem;cursor:pointer;text-align:left;margin-bottom:.35rem;transition:all .2s}
.mode-btn:hover,.mode-btn.active{background:#c8973a;color:#1a1612;border-color:#c8973a}

/* ── Translation grid ── */
.translation-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.trans-btn{background:#2a1f14;color:#e8dcc8;border:1px solid #3d2f1e;border-radius:8px;padding:.4rem;font-size:.78rem;cursor:pointer;transition:all .2s;text-align:center}
.trans-btn.active{background:#c8973a;color:#1a1612;border-color:#c8973a}

.fav-item{background:#221c14;border:1px solid #3d2f1e;border-radius:8px;padding:.6rem;font-size:.78rem;color:#e8dcc8;margin-bottom:.4rem;cursor:pointer;position:relative}
.fav-item:hover{border-color:#c8973a}
.fav-del{position:absolute;top:.4rem;right:.4rem;background:none;border:none;color:#a89070;cursor:pointer;font-size:.75rem}

/* ── History ── */
.hist-item{background:#221c14;border:1px solid #3d2f1e;border-radius:8px;padding:.55rem .7rem;font-size:.78rem;color:#e8dcc8;margin-bottom:.35rem;cursor:pointer;pos
